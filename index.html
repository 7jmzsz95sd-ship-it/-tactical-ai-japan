<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TACTICAL AI // JAPAN</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:10px;
  background:#020604;
  color:#43ff88;
  font-family:"Courier New",monospace;
}

.container{
  max-width:900px;
  margin:auto;
}

.panel,.header{
  border:1px solid #1d7f43;
  background:#030a06;
  padding:12px;
  margin-bottom:10px;
}

.header{
  padding:15px;
}

.logo{
  font-size:21px;
  font-weight:bold;
  letter-spacing:2px;
}

.sub{
  font-size:11px;
  opacity:.65;
  margin-top:5px;
}

.status{
  margin-top:10px;
  font-size:12px;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#43ff88;
  box-shadow:0 0 10px #43ff88;
  margin-right:5px;
}

.title{
  font-size:12px;
  border-bottom:1px solid #164d2b;
  padding-bottom:7px;
  margin-bottom:10px;
}

input{
  width:100%;
  padding:12px;
  background:#020604;
  color:#43ff88;
  border:1px solid #1d7f43;
  border-radius:5px;
  outline:none;
  font-family:inherit;
}

button{
  background:#06130b;
  color:#43ff88;
  border:1px solid #1d7f43;
  border-radius:5px;
  padding:11px 13px;
  margin:4px;
  font-family:inherit;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.row{
  display:flex;
  gap:5px;
}

.row input{
  flex:1;
}

.result{
  white-space:pre-wrap;
  line-height:1.6;
  margin-top:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
}

.full{
  width:calc(100% - 8px);
}

.small{
  font-size:11px;
  opacity:.7;
}

.cameraBox{
  border:1px solid #1d7f43;
  padding:10px;
  margin-top:10px;
}

.cameraImageBox,
.videoBox{
  border:1px solid #1d7f43;
  padding:5px;
  margin-top:10px;
  background:#000;
}

.cameraImage{
  display:block;
  width:100%;
  height:auto;
  min-height:180px;
  object-fit:contain;
  background:#000;
}

.cameraVideo{
  display:block;
  width:100%;
  max-height:520px;
  background:#000;
}

.cameraLiveBadge{
  padding:6px 8px;
  font-size:11px;
  border-bottom:1px solid #164d2b;
  margin-bottom:5px;
}

.cameraError{
  padding:15px;
  border:1px solid #806f1d;
  color:#ffe66d;
  line-height:1.6;
}

.live{
  color:#43ff88;
}

.autoStatus{
  margin-top:8px;
  padding:8px;
  border-left:2px solid #43ff88;
  font-size:11px;
  letter-spacing:1px;
}

.liveDot{
  animation:blink 1s infinite;
}

.cameraCountdown{
  margin-top:5px;
  font-size:12px;
  color:#7affb5;
  letter-spacing:1px;
}

.modeTag{
  display:inline-block;
  padding:3px 7px;
  border:1px solid #1d7f43;
  margin-top:5px;
  font-size:10px;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.25}
}

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .row{
    flex-direction:column;
  }

  .row button{
    width:calc(100% - 8px);
  }

}
</style>
</head>

/* =====================================================
   カメラ自動更新
===================================================== */

let currentCamera=null;
let cameraRefreshTimer=null;
let cameraCountdownTimer=null;
let cameraNextUpdate=120;


function stopCameraAutoRefresh(){

if(cameraRefreshTimer){
clearInterval(cameraRefreshTimer);
cameraRefreshTimer=null;
}

if(cameraCountdownTimer){
clearInterval(cameraCountdownTimer);
cameraCountdownTimer=null;
}

}


function formatCountdown(seconds){

return String(
Math.floor(seconds/60)
).padStart(2,"0")
+
":"
+
String(
seconds%60
).padStart(2,"0");

}


function updateCameraCountdown(){

const element=
document.getElementById(
"cameraCountdown"
);

if(element){

element.textContent=
"NEXT UPDATE : "
+
formatCountdown(
Math.max(0,cameraNextUpdate)
);

}

}


function startCameraAutoRefresh(){

stopCameraAutoRefresh();

if(
!currentCamera ||
currentCamera.mode!=="image" ||
!currentCamera.image
){
return;
}

const interval=
currentCamera.interval ||
120000;

cameraNextUpdate=
Math.ceil(interval/1000);

updateCameraCountdown();

cameraCountdownTimer=
setInterval(()=>{

cameraNextUpdate--;

if(cameraNextUpdate<0){

cameraNextUpdate=
Math.ceil(interval/1000);

}

updateCameraCountdown();

},1000);


cameraRefreshTimer=
setInterval(()=>{

const image=
document.getElementById(
"liveCameraImage"
);

if(!image)return;

image.src=
currentCamera.image
+
"?t="
+
Date.now();

cameraNextUpdate=
Math.ceil(interval/1000);

updateCameraCountdown();

},interval);

}

===================================================== */

if(
!currentCamera ||
currentCamera.mode!=="image" ||
!currentCamera.image

return;

}


const img=
document.getElementById(
"liveCameraImage"
);

if(!img)return;


img.src=
currentCamera.image

"?t="
+
Date.now();


cameraNextUpdate=
Math.ceil(
(currentCamera.interval||120000)
/1000
);

updateCameraCountdown();

}


/* =====================================================
   VOICE
===================================================== */

function startVoice(){

const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SpeechRecognition){

alert(
"このブラウザでは音声入力に対応していません。"
);

return;

}


const recognition=
new SpeechRecognition();

recognition.lang=
"ja-JP";

recognition.interimResults=
false;

recognition.continuous=
false;


recognition.onstart=()=>{

document.getElementById(
"result"
).textContent=
"🎙 LISTENING...";

};


recognition.onresult=
event=>{

document.getElementById(
"query"
).value=
event.results[0][0]
.transcript;

analyze();

};


recognition.onerror=()=>{

document.getElementById(
"result"
).textContent=
"VOICE ERROR";

};


recognition.start();

}

/* =====================================================
   SPEAK
===================================================== */

function speakResult(){

const text=
document.getElementById(
"result"
).textContent;


if(
!("speechSynthesis" in window)
){

alert(
"音声読み上げに対応していません。"
);

return;

}


speechSynthesis.cancel();


const speech=
new SpeechSynthesisUtterance(
text
);

speech.lang=
"ja-JP";

speech.rate=
1;

speech.pitch=
.9;


speechSynthesis.speak(
speech
);

}


/* =====================================================
   WEATHER
===================================================== */

async function getWeather(){

const weather=
document.getElementById(
"weather"
);

weather.textContent=
"SCANNING WEATHER...";


try{

const url=
"https://api.open-meteo.com/v1/forecast"
+
"?latitude=35.6762"
+
"&longitude=139.6503"
+
"&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code"
+
"&timezone=Asia%2FTokyo";


const response=
await fetch(url);


if(!response.ok){

throw new Error();

}


const data=
await response.json();

const c=
data.current;


weather.textContent=

"LOCATION : TOKYO\n\n"

+

"TEMP : "
+
c.temperature_2m
+
" °C\n"

+

"FEELS : "
+
c.apparent_temperature
+
" °C\n"

+

"HUMIDITY : "
+
c.relative_humidity_2m
+
" %\n"

+

"WIND : "
+
c.wind_speed_10m
+
" km/h\n\n"

+

"● WEATHER DATA RECEIVED";

}

catch(e){

weather.textContent=
"WEATHER CONNECTION ERROR";

}

}
