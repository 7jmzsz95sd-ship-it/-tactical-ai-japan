<!DOCTYPE html>

<meta charset="UTF-8">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:10px;
  background:#020604;
  color:#43ff88;
  font-family:"Courier New",monospace;
}

.container{
  max-width:900px;
  margin:auto;
}

.panel{
  border:1px solid #1d7f43;
  background:#030a06;
  padding:12px;
  margin-bottom:10px;
}

.header{
  border:1px solid #1d7f43;
  padding:15px;
  margin-bottom:10px;
}

.logo{
  font-size:21px;
  font-weight:bold;
  letter-spacing:2px;
}

.sub{
  font-size:11px;
  opacity:.65;
  margin-top:5px;
}

.status{
  margin-top:10px;
  font-size:12px;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#43ff88;
  box-shadow:0 0 10px #43ff88;
  margin-right:5px;
}

.title{
  font-size:12px;
  border-bottom:1px solid #164d2b;
  padding-bottom:7px;
  margin-bottom:10px;
}

input{
  width:100%;
  padding:12px;
  background:#020604;
  color:#43ff88;
  border:1px solid #1d7f43;
  border-radius:5px;
  outline:none;
  font-family:inherit;
}

button{
  background:#06130b;
  color:#43ff88;
  border:1px solid #1d7f43;
  border-radius:5px;
  padding:11px 13px;
  margin:4px;
  font-family:inherit;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.row{
  display:flex;
  gap:5px;
}

.row input{
  flex:1;
}

.result{
  white-space:pre-wrap;
  line-height:1.6;
  margin-top:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
}

.full{
  width:calc(100% - 8px);
}

.small{
  font-size:11px;
  opacity:.7;
}

.cameraBox{
  border:1px solid #1d7f43;
  padding:10px;
  margin-top:10px;
}

.cameraStatus{
  border:1px solid #806f1d;
  color:#ffe66d;
  padding:12px;
  line-height:1.6;
}

.live{
  color:#43ff88;
}

.cameraImageBox{
  border:1px solid #1d7f43;
  padding:5px;
  margin-top:10px;
  background:#000;
}

.cameraImage{
  display:block;
  width:100%;
  height:auto;
  min-height:180px;
  object-fit:contain;
  background:#000;
}

.cameraLiveBadge{
  padding:6px 8px;
  font-size:11px;
  border-bottom:1px solid #164d2b;
  margin-bottom:5px;
}

.cameraError{
  padding:15px;
  border:1px solid #806f1d;
  color:#ffe66d;
  line-height:1.6;
}

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .row{
    flex-direction:column;
  }

  .row button{
    width:calc(100% - 8px);
  }

}
</style>
</head>

/* =====================================================
   都道府県一覧
===================================================== */

function showPrefectures(){

  const menu=
    document.getElementById("cameraMenu");

  const path=
    document.getElementById("cameraPath");

  menu.innerHTML="";

  path.textContent=
    "JAPAN / ALL PREFECTURES";


  prefectures.forEach(pref=>{

    const button=
      document.createElement("button");

    button.className="full";

    button.textContent=
      "▸ "+pref;

    button.onclick=()=>{
      showCities(pref);
    };

    menu.appendChild(button);

  });

}


/* =====================================================
   市区町村
===================================================== */

function showCities(pref){

  const menu=
    document.getElementById("cameraMenu");

  const path=
    document.getElementById("cameraPath");

  menu.innerHTML="";

  path.textContent=
    "JAPAN / "+pref;


  const back=
    document.createElement("button");

  back.className="full";

  back.textContent=
    "← ALL PREFECTURES";

  back.onclick=
    showPrefectures;

  menu.appendChild(back);


  if(!cameraData[pref]){

    const info=
      document.createElement("div");

    info.className="small";

    info.innerHTML=
      "<br>この都道府県のカメラデータは"+
      "まだ登録されていません。";

    menu.appendChild(info);

    return;

  }


  Object.keys(cameraData[pref])
  .forEach(city=>{

    const button=
      document.createElement("button");

    button.className="full";

    button.textContent=
      "▸ "+city;

    button.onclick=()=>{
      showCameras(pref,city);
    };

    menu.appendChild(button);

  });

}

function showCameras(pref,city){

  const menu=
    document.getElementById("cameraMenu");

  const path=
    document.getElementById("cameraPath");

  menu.innerHTML="";

  path.textContent=
    "JAPAN / "+pref+" / "+city;


  const back=
    document.createElement("button");

  back.className="full";

  back.textContent=
    "← "+pref;

  back.onclick=()=>{
    showCities(pref);
  };

  menu.appendChild(back);


  cameraData[pref][city]
  .forEach(camera=>{

    const button=
      document.createElement("button");

    button.className="full";

    button.textContent=
      "📹 "+camera.name;

    button.onclick=()=>{
      showCamera(camera,pref,city);
    };

    menu.appendChild(button);

  });

}


/* =====================================================
   カメラ表示
===================================================== */

let currentCamera=null;


function showCamera(camera,pref,city){

  const view=
    document.getElementById("cameraView");

  const info=
    document.getElementById("cameraInfo");


  currentCamera=camera;

  view.style.display="block";


  let imageHTML="";


  if(camera.image){

    imageHTML=`

      <div class="cameraImageBox">

        <div class="cameraLiveBadge">

          <span class="live">
            ● LIVE IMAGE
          </span>

          &nbsp; // OFFICIAL CAMERA

        </div>


        <img
          class="cameraImage"
          id="liveCameraImage"
          src="${camera.image}?t=${Date.now()}"
          alt="${camera.name}"
          onerror="cameraImageError()"
        >

      </div>

    `;

  }else{

    imageHTML=`

      <div class="cameraError">

        ⚠ LIVE IMAGE NOT AVAILABLE

        <br><br>

        このカメラは公式情報として
        登録されています。

        <br><br>

        ただし、TACTICAL AIから直接表示できる
        画像URLを確認できていないため、
        安全のため直接埋め込みを行っていません。

        <br><br>

        CAMERA STATUS :
        <span class="live">
          OFFICIAL SOURCE VERIFIED
        </span>

      </div>

    `;

  }


  info.innerHTML=`

    <div class="cameraBox">

      <div class="live">
        ● CAMERA ONLINE
      </div>

      <br>

      <b>${camera.name}</b>

      <br><br>

      LOCATION :
      ${pref} / ${city}

      <br>

      TYPE :
      ${camera.type}

      <br>

      UPDATE :
      ${camera.update}

      <br>

      SOURCE :
      ${camera.source}

    </div>


    ${imageHTML}


    ${
      camera.image
      ?
      `
      <button
        class="full"
        onclick="refreshCamera()"
      >
        ↻ REFRESH CAMERA
      </button>
      `
      :
      ""
    }

  `;


  view.scrollIntoView({
    behavior:"smooth"
  });

}

function cameraImageError(){

  const img=
    document.getElementById(
      "liveCameraImage"
    );

  if(!img) return;


  img.outerHTML=`

    <div class="cameraError">

      ⚠ CAMERA CONNECTION ERROR

      <br><br>

      画像サーバーから画像を
      取得できませんでした。

      <br><br>

      CAMERA STATUS :
      <span class="live">
        SOURCE REGISTERED
      </span>

    </div>

  `;

}


/* =====================================================
   カメラ更新
===================================================== */

function refreshCamera(){

  const img=
    document.getElementById(
      "liveCameraImage"
    );

  if(!img) return;


  const base=
    img.src.split("?")[0];


  img.src=
    base+"?t="+Date.now();

}


/* =====================================================
   VOICE
===================================================== */

function startVoice(){

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "このブラウザでは音声入力に対応していません。"
    );

    return;

  }


  const recognition=
    new SpeechRecognition();


  recognition.lang="ja-JP";

  recognition.interimResults=false;

  recognition.continuous=false;


  recognition.onstart=()=>{

    document.getElementById(
      "result"
    ).textContent=
      "🎙 LISTENING...";

  };


  recognition.onresult=(event)=>{

    const text=
      event.results[0][0].transcript;


    document.getElementById(
      "query"
    ).value=text;


    analyze();

  };


  recognition.onerror=()=>{

    document.getElementById(
      "result"
    ).textContent=
      "VOICE ERROR";

  };


  recognition.start();

}


/* =====================================================
   AI
===================================================== */

function analyze(){

  const input=
    document.getElementById(
      "query"
    ).value.trim();


  const result=
    document.getElementById(
      "result"
    );


  if(!input){

    result.textContent=
      "QUERY EMPTY";

    return;

  }


  result.textContent=
    "ANALYZING...\n"+
    "SCANNING INFORMATION NETWORK...";


  setTimeout(()=>{

    let answer=
      "QUERY RECEIVED\n\n"+
      "「"+input+"」\n\n"+
      "TACTICAL AI:\n"+
      "現在は公開情報検索モジュールを使用できます。";


    if(
      input.includes("カメラ") ||
      input.includes("ライブ")
    ){

      answer=
        "LIVE CAMERA NETWORK\n\n"+
        "全国 → 都道府県 → 市区町村 → カメラ\n"+
        "の順番で選択してください。";

    }


    if(
      input.includes("天気") ||
      input.includes("気温")
    ){

      answer=
        "WEATHER REQUEST\n\n"+
        "WEATHER SCANを実行してください。";

    }


    result.textContent=
      answer;

  },700);

}


/* =====================================================
   SPEAK
===================================================== */

function speakResult(){

  const text=
    document.getElementById(
      "result"
    ).textContent;


  if(!("speechSynthesis" in window)){

    alert(
      "音声読み上げに対応していません。"
    );

    return;

  }


  speechSynthesis.cancel();


  const speech=
    new SpeechSynthesisUtterance(text);


  speech.lang="ja-JP";

  speech.rate=1;

  speech.pitch=.9;


  speechSynthesis.speak(speech);

}


/* =====================================================
   WEATHER
===================================================== */

async function getWeather(){

  const weather=
    document.getElementById(
      "weather"
    );


  weather.textContent=
    "SCANNING WEATHER...";


  try{

    const url=
      "https://api.open-meteo.com/v1/forecast"+
      "?latitude=35.6762"+
      "&longitude=139.6503"+
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code"+
      "&timezone=Asia%2FTokyo";


    const response=
      await fetch(url);


    if(!response.ok){
      throw new Error("Weather API error");
    }


    const data=
      await response.json();


    const c=
      data.current;


    weather.textContent=
      "LOCATION : TOKYO\n\n"+
      "TEMP     : "+
      c.temperature_2m+
      " °C\n"+
      "FEELS    : "+
      c.apparent_temperature+
      " °C\n"+
      "HUMIDITY : "+
      c.relative_humidity_2m+
      " %\n"+
      "WIND     : "+
      c.wind_speed_10m+
      " km/h\n\n"+
      "● WEATHER DATA RECEIVED";

  }

  catch(error){

    weather.textContent=
      "WEATHER CONNECTION ERROR";

  }

}

===================================================== */

    if(event.key==="Enter"){
      analyze();
    }
