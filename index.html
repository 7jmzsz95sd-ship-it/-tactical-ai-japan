.result{

.grid{

.full{

.small{

@media(max-width:600px){

/* =====================================================

===================================================== */

function showPrefectures(){

  const menu=
    document.getElementById("cameraMenu");

  const path=
    document.getElementById("cameraPath");

  menu.innerHTML="";

  path.textContent=
    "JAPAN / ALL PREFECTURES";


  prefectures.forEach(pref=>{

    const button=
      document.createElement("button");

    button.className="full";

    button.textContent=
      "▸ "+pref;

    button.onclick=()=>{
      showCities(pref);
    };

    menu.appendChild(button);

  });

}


/* =====================================================
   市区町村
===================================================== */

function showCities(pref){

  const menu=
    document.getElementById("cameraMenu");

  const path=
    document.getElementById("cameraPath");

  menu.innerHTML="";

  path.textContent=
    "JAPAN / "+pref;


  const back=
    document.createElement("button");

  back.className="full";

  back.textContent=
    "← ALL PREFECTURES";

  back.onclick=
    showPrefectures;

  menu.appendChild(back);


  if(!cameraData[pref]){

    const info=
      document.createElement("div");

    info.className="small";

    info.innerHTML=
      "<br>この都道府県のカメラデータは"+
      "まだ登録されていません。";

    menu.appendChild(info);

    return;

  }


  Object.keys(cameraData[pref])
  .forEach(city=>{

    const button=
      document.createElement("button");

    button.className="full";

    button.textContent=
      "▸ "+city;

    button.onclick=()=>{
      showCameras(pref,city);
    };

    menu.appendChild(button);

  });

}

  const path=

  path.textContent=
    "JAPAN / "+pref+" / "+city;


  const back=
    document.createElement("button");

  back.className="full";

  back.textContent=
    "← "+pref;

  back.onclick=()=>{
    showCities(pref);
  };

  menu.appendChild(back);


  cameraData[pref][city]
  .forEach(camera=>{

    const button=
      document.createElement("button");

    button.className="full";

    button.textContent=
      "📹 "+camera.name;

    button.onclick=()=>{
      showCamera(camera,pref,city);
    };

    menu.appendChild(button);

  });

}

/* =====================================================
   VOICE
===================================================== */

function startVoice(){

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "このブラウザでは音声入力に対応していません。"
    );

    return;

  }


  const recognition=
    new SpeechRecognition();

  recognition.lang="ja-JP";

  recognition.interimResults=false;

  recognition.continuous=false;


  recognition.onstart=()=>{

    document.getElementById(
      "result"
    ).textContent=
      "🎙 LISTENING...";

  };


  recognition.onresult=(event)=>{

    const text=
      event.results[0][0].transcript;

    document.getElementById(
      "query"
    ).value=text;

    analyze();

  };


  recognition.onerror=()=>{

    document.getElementById(
      "result"
    ).textContent=
      "VOICE ERROR";

  };


  recognition.start();

}


/* =====================================================
   AI
===================================================== */

function analyze(){

  const input=
    document.getElementById(
      "query"
    ).value.trim();

  const result=
    document.getElementById(
      "result"
    );


  if(!input){

    result.textContent=
      "QUERY EMPTY";

    return;

  }


  result.textContent=
    "ANALYZING...\n"+
    "SCANNING INFORMATION NETWORK...";


  setTimeout(()=>{

    let answer=
      "QUERY RECEIVED\n\n"+
      "「"+input+"」\n\n"+
      "TACTICAL AI:\n"+
      "現在は公開情報検索モジュールを使用できます。";


    if(
      input.includes("カメラ")||
      input.includes("ライブ")
    ){

      answer=
        "LIVE CAMERA NETWORK\n\n"+
        "全国 → 都道府県 → 市区町村 → カメラ\n"+
        "の順番で選択してください。";

    }


    if(
      input.includes("天気")||
      input.includes("気温")
    ){

      answer=
        "WEATHER REQUEST\n\n"+
        "WEATHER SCANを実行してください。";

    }


    result.textContent=answer;

  },700);

}


/* =====================================================
   SPEAK
===================================================== */

function speakResult(){

  const text=
    document.getElementById(
      "result"
    ).textContent;

  if(!("speechSynthesis" in window)){

    alert(
      "音声読み上げに対応していません。"
    );

    return;

  }


  speechSynthesis.cancel();


  const speech=
    new SpeechSynthesisUtterance(text);

  speech.lang="ja-JP";
  speech.rate=1;
  speech.pitch=.9;

  speechSynthesis.speak(speech);

}


/* =====================================================
   WEATHER
===================================================== */

async function getWeather(){

  const weather=
    document.getElementById(
      "weather"
    );


  weather.textContent=
    "SCANNING WEATHER...";


  try{

    const url=
      "https://api.open-meteo.com/v1/forecast"+
      "?latitude=35.6762"+
      "&longitude=139.6503"+
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code"+
      "&timezone=Asia%2FTokyo";


    const response=
      await fetch(url);

    const data=
      await response.json();

    const c=
      data.current;


    weather.textContent=
      "LOCATION : TOKYO\n\n"+
      "TEMP     : "+
      c.temperature_2m+
      " °C\n"+
      "FEELS    : "+
      c.apparent_temperature+
      " °C\n"+
      "HUMIDITY : "+
      c.relative_humidity_2m+
      " %\n"+
      "WIND     : "+
      c.wind_speed_10m+
      " km/h\n\n"+
      "● WEATHER DATA RECEIVED";

  }

  catch(error){

    weather.textContent=
      "WEATHER CONNECTION ERROR";

  }

}
